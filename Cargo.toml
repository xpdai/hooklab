[package]
name = "hooklab"
version = "0.1.0"
edition = "2021"
description = "Local webhook capture, inspect, forward and replay dev tool"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false }

[profile.release]
opt-level = 2
